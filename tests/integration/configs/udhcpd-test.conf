# UDHCP Server configuration for integration testing
# Test network: 172.20.0.0/16

# Interface to listen on
interface	eth0

# IP range for dynamic allocation (test range)
start		172.20.1.10
end		172.20.1.99

# Lease file location
lease_file	/var/lib/dhcp/udhcpd-test.leases

# PID file
pidfile		/var/run/udhcpd-test.pid

# Maximum number of leases
max_leases	90

# Lease time in seconds (1 hour for fast testing)
lease_time	3600

# Minimum lease time
min_lease	300

# Conflict detection
conflict_time	3600

# Offer timeout
offer_time	60

# Decline time
decline_time	3600

# Auto time (lease cleanup)
auto_time	7200

# Syslog facility
syslog		1

# Network configuration options
opt	subnet		255.255.0.0
opt	router		172.20.0.1
opt	dns		8.8.8.8 8.8.4.4
opt	domain		test.local
opt	broadcast	172.20.255.255
opt	lease		3600
opt	dhcptype	1
opt	serverid	172.20.0.10

# NTP server
opt	ntpsrv		172.20.0.1

# NetBIOS name server
opt	wins		172.20.0.1

# Boot options for testing
opt	bootsize	8192
opt	bootfile	pxeboot.bin
opt	tftp		172.20.0.1

# MySQL database configuration
sqlserver	mysql-test
sqluser		dhcp_test
sqlpass		dhcp_test
sqldb		dhcp_test
sqlport		3306

# Enable SQL debugging for tests
sqldebug	1

# Logging configuration for testing
log_level	7
debug		1

# Test-specific options
siaddr		172.20.0.10
sname		dhcp-test-server
boot_file	test.boot

# Security options
chuser		nobody
chroot		/var/lib/dhcp

# Static lease file (fallback if SQL fails)
static_lease_file	/app/config/static_leases_test

# Enable ARP checking
arp_check	1

# Vendor class options for testing
vendor_class_id	TEST-CLIENT-ID

# Rapid commit support
rapid_commit	1

# Client identifier matching
client_id_matching	1

# Authoritative mode for testing
authoritative	1

# Test environment markers
notify_file	/var/log/dhcp/test.notify
